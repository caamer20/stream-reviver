name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:performance
      - run: npm run test:accessibility
      - run: npm run build:channels
      - run: node scripts/release-check.mjs --channel stable
      - run: npm run lint:firefox
