name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.2.0
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - run: npm run check:toolchain
      - run: npm run audit:runtime
      - run: npm run test:release-integrity
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:performance
      - run: npm run test:accessibility
      - run: npm run build:channels
      - run: node scripts/release-check.mjs --channel stable
      - run: npm run lint:firefox
