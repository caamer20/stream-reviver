name: Browser E2E
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Ubuntu restricts user namespaces for downloaded browser binaries.
      # Reuse the runner's installed setuid helper so Chrome keeps its sandbox.
      CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.2.0
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - run: npm run check:toolchain
      - run: npm run build
      # Branded Chrome 137+ ignores --load-extension. Both harnesses need
      # Chrome for Testing to load the unpacked extension into an isolated profile.
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
      - name: Report test browser version
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_DEVEL_SANDBOX"
          test -u "$CHROME_DEVEL_SANDBOX"
          "$CHROME_BIN" --version
      - name: Chromium behavioral scenarios
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e
      - name: Long-lived browser/profile soak smoke
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/soak.mjs --smoke
      - name: Firefox manifest and temporary install
        env:
          FIREFOX_BIN: /usr/bin/firefox
        run: npm run test:firefox
