name: Browser E2E
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.2.0
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - run: npm run check:toolchain
      - run: npm run build
      # Branded Chrome 137+ ignores --load-extension. Both harnesses need
      # Chrome for Testing to load the unpacked extension into an isolated profile.
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
      - name: Report test browser version
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          "$CHROME_BIN" --version
      - name: Allow the test browser to create its sandbox
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # The profile grants user namespaces only to this installed browser.
          test "$CHROME_BIN" = /opt/hostedtoolcache/setup-chrome/chrome/stable/x64/chrome
          sudo install -m 0644 config/ci-chrome.apparmor /etc/apparmor.d/stream-reviver-chrome
          sudo apparmor_parser -r /etc/apparmor.d/stream-reviver-chrome
      - name: Chromium behavioral scenarios
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e
      - name: Long-lived browser/profile soak smoke
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/soak.mjs --smoke
      - name: Firefox manifest and temporary install
        env:
          FIREFOX_BIN: /usr/bin/firefox
        run: npm run test:firefox
