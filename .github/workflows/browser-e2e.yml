name: Browser E2E
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.2.0
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - run: npm run check:toolchain
      - run: npm run build
      - name: Chromium behavioral scenarios
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:e2e
      - name: Long-lived browser/profile soak smoke
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/soak.mjs --smoke
      - name: Firefox manifest and temporary install
        env:
          FIREFOX_BIN: /usr/bin/firefox
        run: npm run test:firefox
