name: Release artifacts
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed-release tag to package (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  STREAM_REVIVER_EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.STREAM_REVIVER_EXPECTED_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.2.0
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - run: npm run check:toolchain
      - name: Build and package the tagged clean source
        run: |
          # Older immutable tags have policy fixtures that inherit CI tag
          # variables. Isolate those fixtures, then explicitly bind the final
          # package to the requested tag before retaining or publishing it.
          env -u STREAM_REVIVER_EXPECTED_TAG -u GITHUB_REF npm run package:tagged
          node scripts/package.mjs --require-tag --expected-tag "$STREAM_REVIVER_EXPECTED_TAG"
      - name: Rebuild twice in independent clean workspaces
        run: npm run verify:reproducible -- --require-tag
      - name: Rebuild the reviewer source archive without Git metadata
        run: npm run verify:source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stream-reviver-${{ env.STREAM_REVIVER_EXPECTED_TAG }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
