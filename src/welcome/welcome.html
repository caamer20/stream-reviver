<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to Stream Reviver</title>
    <link rel="stylesheet" href="welcome.css">
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">▶</div>
      <p class="eyebrow">WELCOME TO</p>
      <h1>Stream Reviver</h1>

      <section>
        <h2>Before enabling monitoring</h2>
        <p id="disclaimer"></p>
      </section>
      <label><input id="agree" type="checkbox"> <span>I have read and understand this disclaimer.</span></label>
      <button id="continue" type="button" disabled>Acknowledge and continue</button>

      <p class="privacy">No analytics, tracking, or external API calls. Settings remain in browser storage.</p>
    </main>
    <script src="welcome.js"></script>
  </body>
